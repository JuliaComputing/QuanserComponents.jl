<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0)">
<rect width="1000" height="1000" fill="white"/>
<rect x="4" y="4" width="992" height="992" stroke="#A1A1AA" stroke-width="8"/>
<!-- Zero axis -->
<line x1="70" y1="500" x2="940" y2="500" stroke="#A1A1AA" stroke-width="10" stroke-linecap="round"/>
<line x1="90" y1="130" x2="90" y2="870" stroke="#A1A1AA" stroke-width="10" stroke-linecap="round"/>
<!-- Quadratically spaced speeds: fine near zero, coarse at the top. Levels at
