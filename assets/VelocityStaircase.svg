      stroke="#131316" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M790 236 L790 520 L930 520"
      stroke="#131316" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<defs>
