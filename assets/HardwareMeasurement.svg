<line x1="340" y1="710" x2="340" y2="650" stroke="#A1A1AA" stroke-width="12"/>
<line x1="192" y1="648" x2="234" y2="606" stroke="#A1A1AA" stroke-width="12"/>
<line x1="130" y1="500" x2="190" y2="500" stroke="#A1A1AA" stroke-width="12"/>
<line x1="192" y1="352" x2="234" y2="394" stroke="#A1A1AA" stroke-width="12"/>
