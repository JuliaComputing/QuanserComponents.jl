<!-- Motor -->
<circle cx="760" cy="500" r="150" stroke="#131316" stroke-width="14" fill="none"/>
<text x="760" y="546" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="bold" fill="#131316" text-anchor="middle">M</text>
<line x1="560" y1="500" x2="610" y2="500" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
</g>
<defs>
