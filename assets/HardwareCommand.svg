<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0)">
<rect width="1000" height="1000" fill="white"/>
<rect x="4" y="4" width="992" height="992" stroke="#A1A1AA" stroke-width="8"/>
<!-- Commanded voltage arriving -->
<line x1="90" y1="500" x2="250" y2="500" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<path d="M250 500 L206 474 M250 500 L206 526" stroke="#131316" stroke-width="14" fill="none" stroke-linecap="round"/>
