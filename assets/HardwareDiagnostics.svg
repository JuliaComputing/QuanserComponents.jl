<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0)">
<rect width="1000" height="1000" fill="white"/>
<rect x="4" y="4" width="992" height="992" stroke="#A1A1AA" stroke-width="8"/>
<!-- Stopwatch: the loop's own timing is what this reports -->
<circle cx="360" cy="540" r="230" stroke="#131316" stroke-width="16" fill="none"/>
<line x1="360" y1="310" x2="360" y2="240" stroke="#131316" stroke-width="16" stroke-linecap="round"/>
<rect x="310" y="200" width="100" height="44" rx="16" stroke="#131316" stroke-width="16" fill="none"/>
<!-- Hands, at a period rather than an o'clock -->
<line x1="360" y1="540" x2="360" y2="380" stroke="#131316" stroke-width="18" stroke-linecap="round"/>
<line x1="360" y1="540" x2="490" y2="605" stroke="#131316" stroke-width="18" stroke-linecap="round"/>
<circle cx="360" cy="540" r="30" fill="#131316"/>
<!-- Tick marks -->
<line x1="360" y1="330" x2="360" y2="370" stroke="#A1A1AA" stroke-width="14"/>
<line x1="570" y1="540" x2="530" y2="540" stroke="#A1A1AA" stroke-width="14"/>
<line x1="360" y1="750" x2="360" y2="710" stroke="#A1A1AA" stroke-width="14"/>
<line x1="150" y1="540" x2="190" y2="540" stroke="#A1A1AA" stroke-width="14"/>
<!-- Periods leaving the block: even, then one late -->
<line x1="660" y1="360" x2="940" y2="360" stroke="#A1A1AA" stroke-width="12" stroke-linecap="round"/>
<line x1="700" y1="320" x2="700" y2="400" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<line x1="780" y1="320" x2="780" y2="400" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<line x1="860" y1="320" x2="860" y2="400" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<line x1="700" y1="600" x2="700" y2="680" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<line x1="780" y1="600" x2="780" y2="680" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<line x1="900" y1="600" x2="900" y2="680" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<line x1="660" y1="640" x2="940" y2="640" stroke="#A1A1AA" stroke-width="12" stroke-linecap="round"/>
</g>
<defs>
<clipPath id="clip0"><rect width="1000" height="1000" fill="white"/></clipPath>
</defs>
</svg>
