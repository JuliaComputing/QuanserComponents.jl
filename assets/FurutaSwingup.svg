<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0)">
<rect width="1000" height="1000" fill="white"/>
<rect x="4" y="4" width="992" height="992" stroke="#A1A1AA" stroke-width="8"/>
<!-- Controller -->
<rect x="90" y="360" width="270" height="270" stroke="#131316" stroke-width="14" fill="none"/>
<text x="225" y="540" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="bold" fill="#131316" text-anchor="middle">C</text>
<!-- Command out to the plant -->
<line x1="360" y1="440" x2="656" y2="440" stroke="#131316" stroke-width="14" stroke-linecap="round"/>
<path d="M656 440 L610 414 M656 440 L610 466" stroke="#131316" stroke-width="14" fill="none" stroke-linecap="round"/>
<!-- The simulated pendulum: dashed, to distinguish it from FurutaHardware's solid rig -->
<circle cx="700" cy="560" r="18" fill="#131316"/>
<line x1="700" y1="560" x2="820" y2="560" stroke="#A1A1AA" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="34,22"/>
<line x1="820" y1="560" x2="790" y2="300" stroke="#131316" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="40,26"/>
<circle cx="790" cy="300" r="42" stroke="#131316" stroke-width="14" fill="none" stroke-dasharray="30,20"/>
<!-- Measurements fed back -->
<path d="M700 640 L700 800 L225 800 L225 664" stroke="#131316" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M225 664 L199 712 M225 664 L251 712" stroke="#131316" stroke-width="14" fill="none" stroke-linecap="round"/>
</g>
<defs>
