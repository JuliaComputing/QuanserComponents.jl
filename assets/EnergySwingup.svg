<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0)">
<rect width="1000" height="1000" fill="white"/>
<rect x="4" y="4" width="992" height="992" stroke="#A1A1AA" stroke-width="8"/>
<!-- Pendulum pivot -->
<circle cx="380" cy="500" r="12" fill="#A1A1AA"/>
<!-- Pendulum rod (hanging down) -->
<line x1="380" y1="500" x2="380" y2="700" stroke="#A1A1AA" stroke-width="8" stroke-linecap="round" stroke-dasharray="20,12"/>
<!-- Pendulum bob (ghost position) -->
<circle cx="380" cy="700" r="22" fill="none" stroke="#A1A1AA" stroke-width="4" stroke-dasharray="8,6"/>
<!-- Swing-up arc -->
<path d="M380 700 A200 200 0 0 1 380 300" stroke="#131316" stroke-width="8" fill="none" stroke-dasharray="16,10"/>
<!-- Upward arrow -->
<polygon points="380,180 340,300 380,260 420,300" fill="#131316"/>
<!-- Pendulum rod (up position) -->
<line x1="380" y1="500" x2="380" y2="300" stroke="#131316" stroke-width="10" stroke-linecap="round"/>
<!-- Pendulum bob (up position) -->
<circle cx="380" cy="300" r="28" fill="#131316"/>
<!-- "E" label -->
<text x="620" y="560" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="bold" fill="#131316">E</text>
<!-- Up arrow next to E -->
<polygon points="720,280 690,360 720,330 750,360" fill="#131316"/>
</g>
<defs>
<clipPath id="clip0">
<rect width="1000" height="1000" fill="white"/>
</clipPath>
</defs>
</svg>