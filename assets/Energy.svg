<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0)">
<rect width="1000" height="1000" fill="white"/>
<rect x="4" y="4" width="992" height="992" stroke="#A1A1AA" stroke-width="8"/>
<!-- Pendulum pivot -->
<circle cx="400" cy="280" r="12" fill="#A1A1AA"/>
<!-- Pendulum rod -->
<line x1="400" y1="280" x2="340" y2="480" stroke="#131316" stroke-width="10" stroke-linecap="round"/>
<!-- Pendulum bob -->
<circle cx="340" cy="480" r="28" fill="#131316"/>
<!-- "E" label -->
<text x="560" y="560" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="bold" fill="#131316">E</text>
</g>
<defs>
<clipPath id="clip0">
<rect width="1000" height="1000" fill="white"/>
</clipPath>
</defs>
</svg>