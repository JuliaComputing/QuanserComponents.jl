<circle cx="500" cy="300" r="30" fill="#131316"/>
<!-- Balance/stability guard arcs on each side -->
<path d="M330 470 A250 250 0 0 1 400 300" stroke="#A1A1AA" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M670 470 A250 250 0 0 0 600 300" stroke="#A1A1AA" stroke-width="8" fill="none" stroke-linecap="round"/>
<!-- Base -->
<rect x="380" y="670" width="240" height="40" rx="8" fill="#131316"/>
</g>
<defs>
